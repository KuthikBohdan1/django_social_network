{% extends 'base.html' %}
{% block content %}

<h2>post detail</h2>



<div class="card overflow-hidden" style="max-width: 700px; max-height: 700px;">
    <div class="card-body">
      <h5 class="card-title">{{ post.profile.author }}</h5>
      <p class="card-text">{{ post.description }}</p>
      <p class="card-text"><small class="text-body-secondary">{{ post.date_publish }}</small></p>
    </div>

        <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">

    {% for media in post.media_posts.all %}
          <div class="carousel-item active">
             <img src="{{ media.media.url }}" class="d-block w-100 post-detail" alt="...">
          </div>
    {% endfor %}
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

  </div>

  <button class="like-button" id="button_like">
    <span class="icon">👍</span> Like
  </button>

  


<a href="{% url 'main:comments-post' post_id=post_id %}" class="btn btn-primary">кометарі поста</a>

function ajaxSend(){

}

</script>

<textarea name="" id="ajax_result" class="form-control"></textarea>

<button class="btn btn-success bnt-lg" onclick="ajaxSend()">ajaxSend</button>

<script>
  function ajaxSend(){
    
    fetch('/ajax_request/')
    .then(response => {
      console.log(response)
      if (!response.ok){
        throw new Error('Network response was not ok'+ response.statusText);
      }
      document.body.classList.remove("bg-warning");
      document.body.classList.add("bg-success")
      return response.text()
    })
    .then(data => {
        document.getElementById("ajax_result").innerText = data
    })
    .catch(error => console.log('Error:', error))
  }


</script> 

{% endblock content %}
