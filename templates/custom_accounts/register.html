{% extends 'base.html' %}
{% block content %}
<h3>Реєстрація</h3>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{form.as_div}}
    <button type="submit" class="btn btn-primary">Зареєструватися</button>
    <a href="{% url 'accounts:login' %}" class="btn btn-link">Увійти</a>
</form>
{% endblock content %}
