{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">{{ page_title }}</h1>
            
            <!-- Контейнер для постів -->
            <div id="posts-container" style="max-width: 500px;">
                <!-- Сюди будуть додаватися пости через JavaScript -->
            </div>
            
            <div class="text-center mt-4">
                <button id="load-more-btn" class="btn btn-primary">Завантажити ще</button>
            </div>
        </div>
    </div>
</div>


<script>
    let currentPage = 1;

    /**
     * Функція для завантаження і відображення постів
     */
    async function loadPosts() {
        try {
            // Робимо запит до API на отримання постів
            const response = await fetch(`{{ api_url }}?page=${currentPage}`);
            const data = await response.json();
            
            // Отримуємо контейнер для постів
            const postsContainer = document.getElementById('posts-container');
            
            // Додаємо кожен пост на сторінку
            data.results.forEach(post => {
                const postHtml = `

                ${post.description} 
        <div class="card overflow-hidden" style="width: 600px; max-height: 650px;">
        <div class="card-body text-center">
          <div class="row">
            <div class="col-2"><img src="${ post.profile_avatar }" class="avatar_post" alt=""></div>
            <div class="col-4"><h6 class="card-title">${ post.profile_user_email }</h6>
            </div>
            <p class="text-body">${ post.description }</p>
            <small class="text-body-secondary">${ post.date_publish }</small>
            <div id="carousel-${post.id}" class="carousel slide">
            <div class="carousel-inner">
            ${post.media.map((mediaItem, index) => {
                const file = mediaItem.media;
                const type = file.split('.').pop().toLowerCase();

                if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(type)) {

                    return `
                    <div class="carousel-item ${index === 0 ? 'active' : ''}">
                    <img src="${file}" class="d-block w-100" alt="image">
                    </div>
                `;
                } else if (['mp4', 'webm', 'ogg'].includes(type)){
                    return `
                    <div class="carousel-item ${index === 0 ? 'active': ''}">
                    <video class="d-block w-100" controls>
                    <source src="${file}" type="video/${type}">
                    </video>
                    </div>
                    `
                }  
            }).join('')}
            </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carousel-${post.id}" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
    </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carousel-${post.id}" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
    </div>
          </div>
          <p class="card-text">

          <a href="/post-detail/${post.id}">qw</a>

          </p>
        </div>
                `;
                postsContainer.innerHTML += postHtml;
            });
            
            
            // Перевіряємо, чи є ще пости
            if (!data.next) {
                const loadMoreBtn = document.getElementById('load-more-btn');
                loadMoreBtn.style.display = 'none';            
            }
            
            // Збільшуємо номер сторінки
            currentPage++;
            
        } catch (error) {
            console.error('Помилка завантаження постів:', error);
        }
    }
    

    document.addEventListener('DOMContentLoaded', function() {
        loadPosts();
        // Додаємо обробник кліку для кнопки "Завантажити ще"
        document.getElementById('load-more-btn').addEventListener('click', loadPosts);
        
        // Додаємо обробник кліку для кнопок лайків 
    
    });
</script>
{% endblock content %}
